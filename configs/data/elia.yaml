# Elia (Belgian TSO) open data — all source-specific knowledge lives here.
# Column names follow the portal's field ids (verified against 2024 exports);
# if the portal renames a field the fix is a one-line edit here, no code change.
_target_: microgrid.data.sources.elia.EliaSource   # built by microgrid.assemble.build_source
name: elia
raw_dir: data/raw/elia
csv_sep: ";"

# Full available history. The downloader chunks this by calendar year into
# data/raw/elia/<stem>_<year>.csv and SKIPS years already on disk, so an
# existing wind_2024.csv is reused and only 2019-2023 get fetched.
# date_end is exclusive.
#   python scripts/download_data.py                                   # 2019-2024
#   python scripts/download_data.py data.date_start=2024-01-01        # 2024 only
#   python scripts/download_data.py data.overwrite=true               # force refetch
date_start: "2019-01-01"
date_end: "2025-01-01"
overwrite: false

api:
  base_url: https://opendata.elia.be/api/explore/v2.1/catalog/datasets

# Observed archive coverage (checked 2026-08): wind and load have data from
# 2019-01, but solar (ods032) only from ~2020-07 — solar_2019.csv comes back
# header-only and is skipped at parse time. Since forecast.history_columns
# includes solar_measured and any window containing a NaN is dropped, forecast
# windows before mid-2020 are dropped for ALL three targets.
datasets:
  wind:
    dataset_id: ods031
    file: wind.csv            # stem only; real files are wind_<year>.csv
    datetime_col: datetime
    measured_col: measured
    forecast_da_col: dayaheadforecast
    # rows split by offshore/onshore x region x grid connection (disjoint) -> national total
    aggregate: sum_over_rows
    filters: {}
  solar:
    dataset_id: ods032
    file: solar.csv
    datetime_col: datetime
    measured_col: measured
    forecast_da_col: dayaheadforecast
    aggregate: null
    filters:
      region: Belgium        # dataset carries a pre-aggregated national row
  load:
    dataset_id: ods001
    file: load.csv
    datetime_col: datetime
    measured_col: totalload   # Elia names the measured national load 'totalload'
    forecast_da_col: dayaheadforecast
    aggregate: null
    filters: {}
