# Top-level pipeline config (hydra composition root).
# Swap any group from the CLI, e.g.:
#   python scripts/build_dataset.py data=gefcom2014
#   python scripts/train_forecast.py forecast.target=wind model=lstm
defaults:
  - data: elia
  - data@nwp: nwp_openmeteo   # NWP side-table under cfg.nwp; only loaded when features.steps includes 'nwp'
  - cleaning: default
  - features: default
  - forecast: default
  - model: lstm
  - system: default
  - optimize: default
  - rl: default                 # DRL dispatch (task 04); swap with rl=ppo / rl=smoke
  - scenario: winter_weekday    # named dispatch scenario; swap with scenario=price_spike
  - _self_

alignment:
  freq: 15min          # canonical grid; all series are aligned onto it

# Three-way dispatch comparison (scripts/compare_dispatch.py, task 04).
compare:
  max_days: 0          # 0 = all Nov–Dec test days; >0 caps for a quick dev run
  robust_subset: 12    # seeded day subset for the forecast-error robustness curve
  subset_seed: 20241109
  max_seconds: null    # time-boxed + resumable (per-day cache); null = run to completion
  methods: [rule, nsga3, rl]   # subset to e.g. [rule, nsga3] to run without an RL checkpoint
  opt_seeds: [42]      # NSGA-III optimiser-seed axis (overrides optimize.seed per work item);
                       # distinct from subset_seed (which picks robustness days) and from the
                       # forecast-noise seeds. >=3 seeds for any headline point (task 08 §8).
  cache_dir: null      # scratch-run override; null = models/comparison/cache
  out_dir: null        # scratch-run override for comparison.json AND figures; null = models/comparison (figures then go to paths.figures_dir)
  # Residual-scaling γ grids (task 08 phase 2): fc_γ = clip(actual + γ·(fc_nominal − actual), 0, None).
  # γ=0 perfect foresight, γ=1 nominal (served from the cached nominal, never re-solved), γ>1 scales
  # the real forecast error up. The curve's x axis is the measured MAE stored per point, never γ.
  residual_gammas: []          # γ values run on ALL test days, e.g. [0.0, 0.5, 2.0]
  residual_subset_gammas: []   # extra γ values on the robust_subset days only, e.g. [0.25, 0.75, 1.5, 3.0]
  attribution_targets: []      # per-target attribution on the subset days: γ=0 on this series alone,
                               # the other two at the nominal forecast; e.g. [load, wind, solar]
  days: []                     # restrict the run to an explicit day list (task 08 §9 scratch runs);
                               # [] = the full test period. Unknown days raise, never silently drop.
  tier: null                   # forecast tier for this run's cache entries (task 08 §7); null =
                               # lstm_dispatch. One run = one tier; set rl.train.forecast_source
                               # (+ forecast.run_name for model tiers) to match, e.g.
                               #   compare.tier=tso rl.train.forecast_source=tso
  perfect_biased: false        # task 08 §9.1 H3: add mechanism perfect_biased — perfect foresight plus
                               # each series' signed mean forecast error measured on the VALIDATION
                               # split (never the test days), one point per test day per opt seed
  milp: false                  # task 09 §6.2: additionally solve the deterministic LP lower bound per
                               # item on the SAME planning profile (planned-vs-planned, 09 §3.4), stored
                               # under the non-method item key milp_planned; settings from optimize.milp

paths:
  interim_dir: data/interim
  processed_dir: data/processed
  figures_dir: reports/figures
  models_dir: models

hydra:
  run:
    dir: .             # do not chdir into outputs/
  output_subdir: null
