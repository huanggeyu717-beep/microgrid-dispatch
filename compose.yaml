# One command from a clean clone (task S4 phase 3 — its whole acceptance test):
#
#     docker compose up
#
# Builds the image and serves the day-ahead forecast interface on
# http://localhost:8000 — interactive docs at http://localhost:8000/docs.
# Nothing is downloaded, nothing is trained, and no volume is mounted: the
# three checkpoints are in the image and every request carries its own input
# window. If this file needed a bind mount to work, phase 2 would have chosen
# the wrong interface shape.
services:
  forecast:
    build: .
    image: microgrid-forecast:0.1.0
    ports:
      - "8000:8000"
    restart: unless-stopped
